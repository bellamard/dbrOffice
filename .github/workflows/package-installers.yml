name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            artifact: DBR-Office-Windows
            output: dist/windows/*.exe
          - os: ubuntu-22.04
            platform: linux
            artifact: DBR-Office-Linux
            output: dist/linux/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wix = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wix "candle.exe"))) {
            choco install wixtoolset --yes --no-progress
          }
          if (-not (Test-Path (Join-Path $wix "candle.exe"))) {
            throw "WiX Toolset 3 n'a pas été trouvé après l'installation."
          }
          Add-Content $env:GITHUB_PATH $wix

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
        env:
          DBR_VERSION: 1.0.0

      - name: Build Linux installer
        if: matrix.platform == 'linux'
        run: bash scripts/package-linux.sh
        env:
          DBR_VERSION: 1.0.0

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
